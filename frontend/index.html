<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: Android resizes the layout viewport
         for the on-screen keyboard (iOS needs the visualViewport JS path instead).
         Ignored on desktop webviews. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Monkey Deck</title>
    <!-- PWA (M2): remote clients (phone browser / Capacitor shell) get an
         installable standalone app. Harmless no-op for the desktop webview. -->
    <!-- Icon files are renamed to icon-<size>-<md5-head-8>.png (content hash).
         Chrome 144+ treats an icon as changed only when its URL changes
         (web.dev/manifest-updates), so baking the hash into the filename
         cache-busts on every icon swap without query-string hacks.
         When replacing icons: re-hash each file, rename, and update every
         reference here + in manifest.webmanifest. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192-dd0e986e.png" />
    <meta name="theme-color" content="#1a1a1c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
