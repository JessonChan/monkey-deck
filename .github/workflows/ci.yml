# Pull request / push 编译验证(不发 release)。
# 确保三平台均可构建、前端类型检查通过、后端测试编译通过。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 后端:Go 编译 + 测试 ──────────────────────────────────────
  backend:
    name: Backend (Go ${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            runner: macos-14
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
    # Windows code does not currently compile (Unix-only syscalls in
    # internal/acp + internal/terminal; platform split is deferred). Keep the
    # leg visible but non-blocking until the split lands.
    continue-on-error: ${{ matrix.goos == 'windows' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # go:embed all:frontend/dist (main.go) fails on a fresh checkout: dist is
      # a build artifact never present in git. Stub a minimal file so the Go
      # build passes; release.yml does a real frontend build and is unaffected.
      - name: Stub frontend/dist (go:embed needs the dir)
        shell: bash
        run: mkdir -p frontend/dist && echo stub > frontend/dist/index.html
      # GOOS=linux reaches the Wails GTK4/WebKitGTK cgo backend, which needs
      # dev headers the runner does not ship. Superset of release.yml's
      # install list; apt resolves the transitive deps.
      - name: Install Linux GTK/WebKit dev deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev libglib2.0-dev
      - name: Build backend
        env:
          GOOS: ${{ matrix.goos }}
        run: go build . ./internal/...

      # The linux leg now runs a real cgo build (Wails GTK4/WebKitGTK backend,
      # headers installed above). Full packaging (deb/rpm/AppImage) still
      # happens in release.yml.
      - name: Vet
        if: matrix.goos != 'windows'
        run: go vet ./internal/...
      - name: Test compile (no run)
        run: go test -run xxx_none ./internal/...

  # ── 前端:TypeScript 类型检查 + 构建 ──────────────────────────
  frontend:
    name: Frontend (tsc + vite build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # frontend/bindings is a generated artifact, never present in git
      # (.gitignore), but the frontend build imports it. Generate it here,
      # pinned to the go.mod wails version — a PATH-installed wails3 may be on
      # a different release line whose generator output is incompatible
      # (same rationale as build/Taskfile.yml generate:bindings).
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The bindings step below builds the wails3 CLI via `go run`, which
      # links GTK4/WebKitGTK through cgo and fails on the bare runner without
      # dev headers. Same package list as the backend job's install step; the
      # backend's `if: matrix.goos == 'linux'` gate is dropped here because
      # the frontend job is a single ubuntu-24.04 leg (no matrix).
      - name: Install Linux GTK/WebKit dev deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev libglib2.0-dev
      - uses: oven-sh/setup-bun@v2
      - name: Install deps
        working-directory: frontend
        run: bun install --frozen-lockfile
      # Verbatim equivalent of build/Taskfile.yml generate:bindings with
      # BUILD_FLAGS default (empty). go:mod:tidy is intentionally skipped:
      # CI's go.mod is already tidy and must not be modified.
      - name: Generate bindings (pinned to go.mod wails version)
        run: |
          WAILS_VERSION="$(go list -m github.com/wailsapp/wails/v3 | cut -d' ' -f2)"
          echo "bindings: using wails3 ${WAILS_VERSION} (pinned to go.mod)"
          # Retry: sum.golang.org intermittently returns INTERNAL_ERROR /
          # stream errors on fresh runners — transient, not a code problem.
          for i in 1 2 3; do
            go run "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}" generate bindings -f '' -clean=true -ts -i && break
            [ "$i" = 3 ] && exit 1
            echo "bindings attempt $i failed; retrying in 20s..."
            go clean -cache 2>/dev/null || true
            sleep 20
          done
      - name: Type check + build
        working-directory: frontend
        run: bun run build
